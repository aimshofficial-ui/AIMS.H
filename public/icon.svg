<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="url(#glowBorder)" stroke-width="2" opacity="0.6" />

  <!-- Outer Tech Hexagon -->
  <polygon points="256,76 412,166 412,346 256,436 100,346 100,166" fill="none" stroke="#1e293b" stroke-width="6" />
  <polygon points="256,86 403,171 403,341 256,426 109,341 109,171" fill="none" stroke="url(#neonCyan)" stroke-width="4" filter="url(#glow)" opacity="0.8" />

  <!-- Center Core Symbol: Modern Stylized 'A' + 'H' Intersection -->
  <path d="M256 130 L340 320 L290 320 L270 270 L242 270 L222 320 L172 320 Z" fill="url(#neonCyan)" filter="url(#glow)" />
  <polygon points="256,195 273,240 239,240" fill="#07090e" />

  <!-- Horizontal Interlink / H bar -->
  <rect x="180" y="340" width="152" height="8" rx="4" fill="#38bdf8" opacity="0.9" filter="url(#glow)" />
  <circle cx="210" cy="370" r="6" fill="#06b6d4" />
  <circle cx="256" cy="370" r="7" fill="#8b5cf6" />
  <circle cx="302" cy="370" r="6" fill="#ec4899" />
</svg>
